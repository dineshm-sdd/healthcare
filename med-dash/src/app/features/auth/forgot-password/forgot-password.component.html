<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-50 to-blue-100 p-4">
    <mat-card class="w-full max-w-md p-8 rounded-2xl shadow-xl bg-white/90 backdrop-blur-sm border border-white/50">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-indigo-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <mat-icon class="text-indigo-600 scale-150">lock_reset</mat-icon>
            </div>
            <h1 class="text-2xl font-bold text-gray-800 tracking-tight">Forgot Password?</h1>
            <p class="text-gray-500 mt-2">Enter your email to reset your password</p>
        </div>

        <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">

            <mat-form-field appearance="fill" class="w-full">
                <mat-label>Email Address</mat-label>
                <input matInput formControlName="email" type="email" placeholder="example@email.com">
                <mat-error *ngIf="forgotForm.get('email')?.hasError('required')">Email is required</mat-error>
                <mat-error *ngIf="forgotForm.get('email')?.hasError('email')">Please enter a valid email</mat-error>
            </mat-form-field>

            <button mat-flat-button color="primary" type="submit"
                class="w-full py-6 text-lg rounded-xl mt-2 transition-all duration-300 hover:shadow-lg hover:shadow-indigo-500/30"
                [disabled]="forgotForm.invalid || isLoading()">
                <span *ngIf="!isLoading()">Send Reset Link</span>
                <mat-spinner *ngIf="isLoading()" diameter="24" class="inline-block"></mat-spinner>
            </button>

            <a routerLink="/auth/sign-in" mat-stroked-button color="primary" class="w-full py-6 rounded-xl mt-2">
                Back to Sign In
            </a>

        </form>

        <div *ngIf="successMessage()"
            class="mt-4 p-4 bg-green-50 text-green-700 rounded-lg text-center text-sm border border-green-200 animate-pulse">
            {{ successMessage() }}
        </div>
    </mat-card>
</div>
