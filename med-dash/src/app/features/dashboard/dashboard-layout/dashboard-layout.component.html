<mat-sidenav-container class="h-screen bg-gray-50">
    <mat-sidenav #sidenav mode="side" opened class="w-64 border-r-0 shadow-xl z-20">
        <app-sidebar [userRole]="currentUser()?.role"></app-sidebar>
    </mat-sidenav>

    <mat-sidenav-content class="flex flex-col h-full relative">
        <app-topbar [user]="currentUser()" (toggleSidebar)="sidenav.toggle()"></app-topbar>

        <main class="flex-1 overflow-auto p-4 sm:p-6 lg:p-8">
            <router-outlet></router-outlet>
        </main>
    </mat-sidenav-content>
</mat-sidenav-container>
