<div class="max-w-5xl mx-auto">
    <div class="flex items-center justify-between mb-8">
        <div>
            <h1 class="text-2xl font-bold text-gray-800">Medical Records</h1>
            <p class="text-gray-500">History of your visits and prescriptions</p>
        </div>
        <button mat-stroked-button color="primary" class="rounded-xl">
            <mat-icon>download</mat-icon>
            Download All
        </button>
    </div>

    <mat-card class="rounded-2xl shadow-sm border border-gray-100 !bg-white overflow-hidden">
        <table mat-table [dataSource]="records()" class="w-full">

            <!-- Date Column -->
            <ng-container matColumnDef="date">
                <th mat-header-cell *matHeaderCellDef> Date </th>
                <td mat-cell *matCellDef="let record"> {{record.date | date:'mediumDate'}} </td>
            </ng-container>

            <!-- Type Column -->
            <ng-container matColumnDef="type">
                <th mat-header-cell *matHeaderCellDef> Type </th>
                <td mat-cell *matCellDef="let record">
                    <span class="px-3 py-1 bg-indigo-50 text-indigo-700 rounded-full text-xs font-bold">
                        {{record.type}}
                    </span>
                </td>
            </ng-container>

            <!-- Diagnosis Column -->
            <ng-container matColumnDef="diagnosis">
                <th mat-header-cell *matHeaderCellDef> Diagnosis </th>
                <td mat-cell *matCellDef="let record" class="font-medium text-gray-800"> {{record.diagnosis}} </td>
            </ng-container>

            <!-- Doctor Column -->
            <ng-container matColumnDef="doctor">
                <th mat-header-cell *matHeaderCellDef> Doctor </th>
                <td mat-cell *matCellDef="let record" class="text-gray-500"> {{record.doctor}} </td>
            </ng-container>

            <!-- Actions Column -->
            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef> </th>
                <td mat-cell *matCellDef="let record">
                    <button mat-icon-button color="primary" matTooltip="View Details">
                        <mat-icon>visibility</mat-icon>
                    </button>
                    <button mat-icon-button color="accent" matTooltip="Download PDF">
                        <mat-icon>picture_as_pdf</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns" class="bg-gray-50"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="hover:bg-gray-50 transition-colors">
            </tr>
        </table>
    </mat-card>
</div>
