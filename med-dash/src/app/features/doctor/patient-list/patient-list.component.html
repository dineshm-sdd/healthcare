<div class="max-w-6xl mx-auto">
    <div class="flex items-center justify-between mb-8">
        <div>
            <h1 class="text-2xl font-bold text-gray-800">My Patients</h1>
            <p class="text-gray-500">Directory of all assigned patients</p>
        </div>
        <button mat-flat-button color="primary" class="rounded-xl">
            <mat-icon>person_add</mat-icon>
            Add Patient
        </button>
    </div>

    <mat-card class="rounded-2xl shadow-sm border border-gray-100 !bg-white overflow-hidden">
        <div class="p-4 border-b border-gray-100">
            <mat-form-field appearance="fill" class="w-full sm:w-80 search-field">
                <mat-icon matPrefix>search</mat-icon>
                <input matInput placeholder="Search patients...">
            </mat-form-field>
        </div>

        <table mat-table [dataSource]="patients()" class="w-full">

            <!-- Name Column -->
            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef> Name </th>
                <td mat-cell *matCellDef="let patient">
                    <div class="flex items-center gap-3">
                        <img [src]="'https://ui-avatars.com/api/?name=' + patient.name + '&background=random'"
                            class="w-8 h-8 rounded-full">
                        <span class="font-semibold text-gray-800">{{ patient.name }}</span>
                    </div>
                </td>
            </ng-container>

            <!-- Demographics Column -->
            <ng-container matColumnDef="demographics">
                <th mat-header-cell *matHeaderCellDef> Age / Gender </th>
                <td mat-cell *matCellDef="let patient"> {{ patient.age }} / {{ patient.gender }} </td>
            </ng-container>

            <!-- Condition Column -->
            <ng-container matColumnDef="condition">
                <th mat-header-cell *matHeaderCellDef> Primary Condition </th>
                <td mat-cell *matCellDef="let patient">
                    <span class="px-2 py-1 bg-gray-100 rounded text-xs font-medium">{{ patient.condition }}</span>
                </td>
            </ng-container>

            <!-- Last Visit Column -->
            <ng-container matColumnDef="lastVisit">
                <th mat-header-cell *matHeaderCellDef> Last Visit </th>
                <td mat-cell *matCellDef="let patient"> {{ patient.lastVisit | date:'mediumDate' }} </td>
            </ng-container>

            <!-- Actions Column -->
            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef> </th>
                <td mat-cell *matCellDef="let patient">
                    <button mat-icon-button color="primary" matTooltip="View Profile">
                        <mat-icon>visibility</mat-icon>
                    </button>
                    <button mat-icon-button color="accent" matTooltip="Message">
                        <mat-icon>message</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns" class="bg-gray-50"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="hover:bg-gray-50 transition-colors">
            </tr>
        </table>
    </mat-card>
</div>
